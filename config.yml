backend:
  name: git-gateway
  branch: main # तुमच्या GitHub ब्रांचचे नाव (main किंवा master असेल ते टाका)

media_folder: "images/uploads" # तुम्ही अपलोड केलेले फोटो या फोल्डरमध्ये सेव्ह होतील
public_folder: "/images/uploads"

collections:
  - name: "seeds"
    label: "बियाणे माहिती (Seeds)"
    folder: "content/seeds" # जिथे हा डेटा सेव्ह होईल
    create: true
    fields:
      - {label: "बियाण्याचे नाव", name: "title", widget: "string"}
      - {label: "प्रकार/वाण", name: "variety", widget: "string"}
      - {label: "किंमत / तपशील", name: "description", widget: "text"}
      - {label: "फोटो", name: "image", widget: "image"}
